<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Set tema sebelum render (anti FOUC): localStorage → preferensi sistem → dark */
      (function () {
        try {
          var t = localStorage.getItem("dikaroute-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/dikaroute.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DikaRoute" />
    <meta
      name="description"
      content="DikaRoute — Unified AI Gateway & Intelligent Model Router. Satu endpoint OpenAI-compatible untuk 290+ penyedia AI dengan auto-fallback, kompresi konteks, monitoring, dan keamanan terintegrasi."
    />
    <meta property="og:title" content="DikaRoute — Unified AI Gateway" />
    <meta
      property="og:description"
      content="Satu endpoint. Banyak AI provider. Reliabilitas maksimal."
    />
    <meta name="theme-color" content="#0a0c14" />
    <title>DikaRoute — Unified AI Gateway & Intelligent Model Router</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
